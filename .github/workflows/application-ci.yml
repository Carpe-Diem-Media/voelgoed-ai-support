name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MIX_ENV: test
  VGAS_VERIFY_PGVECTOR: "true"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      timing_key: ${{ steps.history.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore timings from a successful main run
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          TIMING_INPUTS: ${{ hashFiles('.tool-versions', 'mix.lock', 'mix.exs', '.github/workflows/application-ci.yml', 'test/support/ci_timing_formatter.ex') }}
        run: |
          key="test-timing-${ImageOS}-${ImageVersion}-${TIMING_INPUTS}"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          prior=$(gh run list --workflow application-ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty') || exit 0
          if [[ -n "$prior" ]]; then
            gh run download "$prior" --pattern "${key}-*" --dir timing-history || rm -rf timing-history
          fi
      - id: plan
        run: python3 .github/scripts/plan_tests.py >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI_CACHE_WRITER: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
      - run: mix hex.audit
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors

  test:
    name: ExUnit shard ${{ matrix.shard }}
    needs: [plan, build]
    if: needs.plan.outputs.has_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      postgres:
        # pgvector/pgvector:0.8.7-pg18 (PostgreSQL 18.7), linux/amd64 manifest.
        image: pgvector/pgvector@sha256:4bdc16048580b56345bca441bffe8d9b45dd2f5d76963808c853df1661df6e00
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_HOST: 127.0.0.1
      TEST_DATABASE_PORT: '55434'
      TEST_DATABASE_USERNAME: vgas_test
      TEST_DATABASE_NAME: vgas_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
      - name: Create isolated TEST database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          docker exec -i "$POSTGRES_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres <<SQL
          CREATE ROLE vgas_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD '$password';
          CREATE DATABASE vgas_test OWNER vgas_test;
          \connect vgas_test
          CREATE EXTENSION vector;
          SQL
          echo "TEST_DATABASE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Verify the PostgreSQL baseline as the TEST role
        run: bash .github/scripts/verify_postgres.sh 180007
      - name: Run assigned test files
        env:
          TEST_FILES: ${{ toJSON(matrix.files) }}
          CI_TIMING_OUTPUT: timing.json
          VGAS_F04_DISPOSABLE: '1'
          VGAS_VERIFY_VGAS20_UPGRADE: 'true'
        run: |
          [[ "${VGAS_F04_DISPOSABLE:-}" == 1 && "${VGAS_VERIFY_PGVECTOR:-}" == true ]]
          mapfile -d '' -t paths < <(python3 -c 'import json, os, sys; sys.stdout.buffer.write(b"".join(os.fsencode(path) + b"\0" for path in json.loads(os.environ["TEST_FILES"])))')
          (( ${#paths[@]} > 0 ))
          export CI_TEST_RESULTS_OUTPUT
          CI_TEST_RESULTS_OUTPUT=$(mktemp)
          mix test --seed 0 --formatter ExUnit.CLIFormatter --formatter VoelgoedAi.CITimingFormatter "${paths[@]}"
          python3 .github/scripts/verify_test_results.py "$CI_TEST_RESULTS_OUTPUT" shard "${paths[@]}"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: ${{ needs.plan.outputs.timing_key }}-shard-${{ matrix.shard }}
          path: timing.json
          if-no-files-found: error
          retention-days: 21

  snapshots:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # config/runtime.exs requires the TEST connection settings at boot.
    # Snapshot comparison opens no connection, so these point at an unused
    # port and the password is a non-secret placeholder.
    env:
      TEST_DATABASE_HOST: 127.0.0.1
      TEST_DATABASE_PORT: '1'
      TEST_DATABASE_USERNAME: vgas_snapshot_check
      TEST_DATABASE_NAME: vgas_snapshot_check
      TEST_DATABASE_PASSWORD: not-a-credential
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/beam
      - run: mix ash.codegen --check

  migrations:
    name: PostgreSQL migration ${{ matrix.lane }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [fresh, upgrade, vgas001-upgrade]
    services:
      postgres:
        # pgvector/pgvector:0.8.7-pg18 (PostgreSQL 18.7), linux/amd64 manifest.
        image: pgvector/pgvector@sha256:4bdc16048580b56345bca441bffe8d9b45dd2f5d76963808c853df1661df6e00
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_HOST: 127.0.0.1
      TEST_DATABASE_PORT: '55433'
      TEST_DATABASE_USERNAME: vgas_test
      TEST_DATABASE_NAME: vgas_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/beam
      - name: Create isolated TEST database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          docker exec -i "$POSTGRES_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres <<SQL
          CREATE ROLE vgas_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD '$password';
          CREATE DATABASE vgas_test OWNER vgas_test;
          \connect vgas_test
          CREATE EXTENSION vector;
          SQL
          echo "TEST_DATABASE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Verify the PostgreSQL baseline as the TEST role
        run: bash .github/scripts/verify_postgres.sh 180007
      - name: Install the immutable foundation before upgrade
        if: matrix.lane == 'upgrade'
        shell: bash
        run: |
          base_migrations=$(mktemp -d)
          trap 'rm -rf "$base_migrations"' EXIT
          foundation=20261125141215_foundation_extensions_1.exs
          git show "aa93104fd476d208206288658e67bfe70e0780cd:priv/repo/migrations/$foundation" > "$base_migrations/$foundation"
          cmp "$base_migrations/$foundation" "priv/repo/migrations/$foundation"
          mix ecto.migrate --migrations-path "$base_migrations" --strict-version-order
      - name: Install merged VGAS-001 and record synthetic staff history
        if: matrix.lane == 'vgas001-upgrade'
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          base_migrations=$(mktemp -d)
          trap 'rm -rf "$base_migrations"' EXIT
          predecessor=92ef0e39a7808d4ffa692b37b48ba3ee27a05e30
          for name in 20261125141215_foundation_extensions_1.exs 20261125205628_add_staff_authorization.exs; do
            git show "$predecessor:priv/repo/migrations/$name" > "$base_migrations/$name"
            cmp "$base_migrations/$name" "priv/repo/migrations/$name"
          done
          mix ecto.migrate --migrations-path "$base_migrations" --strict-version-order
          docker exec -i "$POSTGRES_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U vgas_test -d vgas_test \
            < .github/scripts/vgas001_upgrade_fixture.sql
      - name: Apply and verify candidate migrations
        shell: bash
        env:
          VGAS_VERIFY_VGAS001_UPGRADE: ${{ matrix.lane == 'vgas001-upgrade' }}
          MIGRATION_LANE: ${{ matrix.lane }}
        run: |
          mix ecto.migrate --strict-version-order
          migrations=$(mix ecto.migrations)
          echo "$migrations"
          if [[ "$migrations" =~ (^|[[:space:]])down[[:space:]] ]]; then
            exit 1
          fi
          export CI_TEST_RESULTS_OUTPUT
          CI_TEST_RESULTS_OUTPUT=$(mktemp)
          foundation_tests=test/voelgoed_ai/repo_foundation_test.exs
          mix test --seed 0 --formatter ExUnit.CLIFormatter --formatter VoelgoedAi.CITimingFormatter "$foundation_tests"
          python3 .github/scripts/verify_test_results.py "$CI_TEST_RESULTS_OUTPUT" "$MIGRATION_LANE" "$foundation_tests"

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the candidate commit range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          range=HEAD
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$BASE" != 0000000000000000000000000000000000000000 ]]; then
            git cat-file -e "$BASE^{commit}"
            range="$BASE..HEAD"
          fi
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" --workdir /repo ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact=100 --log-opts="$range" --no-banner .

  prod_compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --platform linux/amd64 --no-cache --progress=plain --target compile .

  release_package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash .github/scripts/test_application_gate.sh
      - run: docker build --platform linux/amd64 --no-cache --progress=plain --tag vgas-release:ci .
      - run: bash .github/scripts/verify_release.sh vgas-release:ci
      - run: docker build --platform linux/amd64 --no-cache --progress=plain --tag vgas-release:repeat .
      - run: bash .github/scripts/compare_release_payloads.sh vgas-release:ci vgas-release:repeat

  gate:
    name: Application CI gate
    if: always()
    needs: [plan, build, test, snapshots, migrations, secrets, prod_compile, release_package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PLAN: ${{ needs.plan.result }}
      BUILD: ${{ needs.build.result }}
      SNAPSHOTS: ${{ needs.snapshots.result }}
      MIGRATIONS: ${{ needs.migrations.result }}
      SECRETS: ${{ needs.secrets.result }}
      TEST: ${{ needs.test.result }}
      HAS_TESTS: ${{ needs.plan.outputs.has_tests }}
      PROD_COMPILE: ${{ needs.prod_compile.result }}
      RELEASE_PACKAGE: ${{ needs.release_package.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash .github/scripts/check_application_gate.sh
